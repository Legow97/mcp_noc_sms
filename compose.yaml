services:
  api:
    build:
      context: .
    container_name: incident-memory-api
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/incident_memory_db
      CONVERSATION_REDIS_HOST: redis
      GOOGLE_GENAI_USE_VERTEXAI: "False"
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
  frontend:
    build:
      context: ./frontend
    container_name: incident-memory-frontend
    ports:
      - "8090:80"
    depends_on:
      - api
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incident-memory-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_memory_db
    ports:
      - "5432:5432"
    volumes:
      - incident_memory_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: incident-memory-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - incident_memory_redis_data:/data

volumes:
  incident_memory_postgres_data:
  incident_memory_redis_data:
